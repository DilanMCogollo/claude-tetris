<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TETRIS 935</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="game-title">TETRIS 935</h1>
  <div class="top-bar">
    <button id="theme-toggle" type="button" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema (T)">☀️ Modo claro</button>
    <label class="skin-picker" for="skin-select">Skin
      <select id="skin-select" title="Cambiar apariencia de los bloques"></select>
    </label>
  </div>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
            <li><kbd>T</kbd> tema</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="pause-box">
        <p id="pause-title">PAUSA</p>
        <button id="resume-btn" type="button" class="menu-btn primary">Reanudar</button>
        <button id="pause-restart-btn" type="button" class="menu-btn">Reiniciar</button>
        <button id="controls-btn" type="button" class="menu-btn" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
        <ul id="pause-controls" class="pause-controls hidden">
          <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
          <li><span><kbd>↑</kbd><kbd>X</kbd></span> rotar</li>
          <li><span><kbd>↓</kbd></span> bajar (+1)</li>
          <li><span><kbd>Space</kbd></span> caída (+2)</li>
          <li><span><kbd>P</kbd><kbd>Esc</kbd></span> pausa / reanudar</li>
          <li><span><kbd>T</kbd></span> tema</li>
        </ul>
        <label class="start-level" for="start-level">
          Nivel inicial
          <select id="start-level"></select>
        </label>
        <p class="pause-hint">Se aplica al reiniciar o en la próxima partida</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
